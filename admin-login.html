<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন লগইন</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0a2a44,#1a4a6e);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
        .login-container{background:white;padding:40px 35px;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,0.3);max-width:400px;width:100%}
        .login-container h1{font-size:24px;color:#0a2a44;text-align:center}
        .login-container .sub{text-align:center;color:#6c859e;font-size:14px;margin:8px 0 25px}
        .input-group{margin-bottom:18px}
        .input-group label{display:block;font-size:13px;font-weight:600;color:#0a2a44;margin-bottom:5px}
        .input-group input{width:100%;padding:12px 16px;border:2px solid #dce4ed;border-radius:10px;font-size:15px;outline:none}
        .input-group input:focus{border-color:#0077be;box-shadow:0 0 0 4px rgba(0,119,190,0.1)}
        .btn-login{width:100%;padding:14px;background:#0077be;color:white;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
        .btn-login:hover{background:#005a8c}
        .btn-login:disabled{opacity:0.6}
        #errorMsg{color:#e74c3c;text-align:center;margin-top:12px;display:none}
        .spinner{display:inline-block;width:20px;height:20px;border:3px solid #e0e8f0;border-top:3px solid white;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .lock-icon{text-align:center;font-size:48px;margin-bottom:10px}
    </style>
</head>
<body>
<div class="login-container">
    <div class="lock-icon">🔐</div>
    <h1>অ্যাডমিন লগইন</h1>
    <div class="sub">অ্যাডমিন প্যানেল প্রবেশ করুন</div>
    <div class="input-group"><label>👤 ইউজারনেম</label><input type="text" id="username" placeholder="ইউজারনেম দিন" value="MahinKhan"></div>
    <div class="input-group"><label>🔒 পাসওয়ার্ড</label><input type="password" id="password" placeholder="পাসওয়ার্ড দিন" onkeypress="if(event.key==='Enter')login()"></div>
    <button class="btn-login" onclick="login()" id="loginBtn">🔓 লগইন করুন</button>
    <div id="errorMsg"></div>
</div>
<script>
    function login(){
        const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value.trim(),err=document.getElementById('errorMsg'),btn=document.getElementById('loginBtn');
        if(!u||!p){err.textContent='⚠️ ইউজারনেম এবং পাসওয়ার্ড দিন!';err.style.display='block';return}
        btn.innerHTML='<span class="spinner"></span> যাচাই...';btn.disabled=true;err.style.display='none';
        if(u==='MahinKhan'&&p==='Mahin512@@'){sessionStorage.setItem('adminLoggedIn','true');sessionStorage.setItem('adminUser',u);setTimeout(()=>window.location.href='admin.html',500)}
        else{setTimeout(()=>{err.textContent='❌ ভুল ইউজারনেম বা পাসওয়ার্ড!';err.style.display='block';btn.innerHTML='🔓 লগইন করুন';btn.disabled=false},500)}
    }
</script>
</body>
</html>
